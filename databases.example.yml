# Copie as entradas de exemplo para databases.yml e ajuste os valores.
# As credenciais reais ficam nos secrets ou no arquivo privado do executor.
timezone: America/Sao_Paulo

databases:
  home-care:
    status: active # Opcional. Use inactive para pausar os backups.
    name: Home Care
    type: mysql
    executor: actions
    credentials_env: DB_CREDENTIALS
    schedule: '15 * * * *' # A cada hora, no minuto 15.
    grace_minutes: 40
    keep: 10
    encrypt: true # Opcional. Use false para gerar .sql.gz sem criptografia.
    max_storage_mb: 500 # Opcional. Omita para limitar apenas pela quantidade.
    export_procedures: true # Opcional. O padrão é true.
    export_functions: true # Independente de export_procedures.
    export_views: true
    ignore_data: # Preserva a estrutura e omite os dados.
      - activity_log
      - audit_logs
    ignore_table: # Omite a estrutura e os dados.
      - cache
      - cache_locks

  catalogo:
    name: Catálogo
    type: mariadb
    executor: cpanel-principal
    credentials_env: CATALOGO_DB_CREDENTIALS
    schedule: '15 5 1 * *' # Dia 1 de cada mês às 05h15.
    grace_minutes: 120
    keep: 12
    # Sem listas de exclusão, todas as tabelas entram com estrutura e dados.

  cloudflare-app:
    name: Aplicação no Cloudflare
    type: d1
    database_id: "00000000-0000-0000-0000-000000000000"
    # account_id é opcional. Se omitido, usa R2_ACCOUNT_ID.
    credentials_env: D1_API_TOKEN
    executor: actions
    schedule: "15 1 * * *"
    grace_minutes: 40
    keep: 7
    encrypt: true
