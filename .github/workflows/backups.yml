name: Backup de bancos

on:
  workflow_dispatch:
    inputs:
      database:
        description: Identificador do banco para backup manual (vazio executa a rotina agendada)
        type: string
        required: false

concurrency:
  group: db-backups-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      DB_CREDENTIALS: ${{ secrets.DB_CREDENTIALS }}
      DB_CREDENTIALS_MX_SYS_ADMIN: ${{ secrets.DB_CREDENTIALS_MX_SYS_ADMIN }}
      DB_CREDENTIALS_ELETRONICAUTOMACOES: ${{ secrets.DB_CREDENTIALS_ELETRONICAUTOMACOES }}
      DB_CREDENTIALS_DGH: ${{ secrets.DB_CREDENTIALS_DGH }}
      DB_CREDENTIALS_MDAWIKI: ${{ secrets.DB_CREDENTIALS_MDAWIKI }}
      DB_CREDENTIALS_ASL: ${{ secrets.DB_CREDENTIALS_ASL }}
      DB_CREDENTIALS_LJA: ${{ secrets.DB_CREDENTIALS_LJA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências Python
        run: python -m pip install -r requirements.txt
      - name: Instalar clientes de backup
        run: |
          sudo apt-get update
          sudo apt-get install -y age mysql-client
          ln -s mariadb-dump "$GITHUB_WORKSPACE/scripts/actions/mariadb"
          echo "$GITHUB_WORKSPACE/scripts/actions" >> "$GITHUB_PATH"
      - name: Gerar backups
        env:
          MANUAL_DATABASE: ${{ inputs.database }}
        run: |
          args=(run --executor actions)
          if [[ -n "$MANUAL_DATABASE" ]]; then
            args+=(--database "$MANUAL_DATABASE")
          fi
          python db_backups.py "${args[@]}"
      - name: Monitorar cópias no R2
        if: success() || failure()
        run: python db_backups.py monitor --snapshot snapshot.json
      - name: Atualizar a branch state
        if: (success() || failure()) && hashFiles('snapshot.json') != ''
        run: bash scripts/publish-state.sh snapshot.json
