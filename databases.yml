timezone: America/Sao_Paulo
databases:
  mx-sys-admin:
    name: MX Soft | Admin
    type: mysql
    encrypt: false
    executor: actions
    credentials_env: DB_CREDENTIALS_MX_SYS_ADMIN
    schedule: "0 1 * * *"
    grace_minutes: 40
    keep: 5
    max_storage_mb: 500
    export_procedures: false
    export_functions: false
    export_views: false
    ignore_data:
      - ACESSOS
      - LOGS_PAGINA
  eletronicautomacoes:
    name: EletronicAutomacoes
    type: mysql
    encrypt: false
    executor: actions
    credentials_env: DB_CREDENTIALS_ELETRONICAUTOMACOES
    schedule: "15 1 * * *"
    grace_minutes: 40
    keep: 10
    max_storage_mb: 500
    export_procedures: false
    export_functions: false
    export_views: false
    ignore_data:
      - LOGS
  dgh:
    name: DGH
    type: mysql
    encrypt: false
    executor: actions
    credentials_env: DB_CREDENTIALS_DGH
    schedule: "0/10 * * * *"
    grace_minutes: 40
    keep: 10
    max_storage_mb: 500
    export_procedures: false
    export_functions: false
    export_views: false
    ignore_data:
      - LOGS
