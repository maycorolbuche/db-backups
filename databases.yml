timezone: America/Sao_Paulo
databases:
  mx-sys-admin:
    name: MX Soft | Admin
    type: mysql
    encrypt: false
    executor: actions
    credentials_env: DB_CREDENTIALS_MX_SYS_ADMIN
    schedule: "0 1 * * *"
    grace_minutes: 40
    keep: 5
    max_storage_mb: 500
    export_procedures: false
    export_functions: false
    export_views: false
    ignore_data:
      - ACESSOS
      - LOGS_PAGINA
  eletronicautomacoes:
    name: EletronicAutomacoes
    type: mysql
    encrypt: false
    executor: actions
    credentials_env: DB_CREDENTIALS_ELETRONICAUTOMACOES
    schedule: "0 2 * * *"
    grace_minutes: 40
    keep: 10
    max_storage_mb: 500
    export_procedures: false
    export_functions: false
    export_views: false
    ignore_data:
      - LOGS
  dgh:
    name: DGH
    type: mysql
    encrypt: false
    executor: actions
    credentials_env: DB_CREDENTIALS_DGH
    schedule: "0 3 * * *"
    grace_minutes: 40
    keep: 10
    max_storage_mb: 500
    export_procedures: false
    export_functions: false
    export_views: false
    ignore_data:
      - AGENDA_LOGS
      - LOGS
      - LOGS_EVENTOS
      - LOGS_PLANTOES_AUTOMATICOS
      - _BKP_AGENDA
      - _BKP_AGENDA_RESP
    ignore_table:
      - ___BKP_DISP_FUNCIONARIOS
  mdawiki:
    name: MDAWiki
    type: mysql
    encrypt: false
    executor: actions
    credentials_env: DB_CREDENTIALS_MDAWIKI
    schedule: "0 0 * * *"
    grace_minutes: 40
    keep: 3
    max_storage_mb: 2000
    export_procedures: false
    export_functions: false
    export_views: false
    ignore_data:
      - ACESSOS_LOGS
      - CRONJOB_LOGS
      - EMAIL_LOGS
      - PAGINAS_ACESSOS_LOGS
      - PAGINAS_ATUALIZAR_LOGS
  asl:
    status: inactive
    name: ASL Cuidadores
    type: mysql
    encrypt: false
    executor: actions
    credentials_env: DB_CREDENTIALS_ASL
    schedule: "0 4 * * *"
    grace_minutes: 40
    keep: 5
    max_storage_mb: 1500
    export_procedures: false
    export_functions: false
    export_views: false
    ignore_data:
      - AGENDA_LOGS
      - LOGS
      - LOGS_EVENTOS
      - LOGS_PLANTOES_AUTOMATICOS
      - _BKP_AGENDA
      - _BKP_AGENDA_RESP
  mrpag:
    name: MRPag
    type: d1
    encrypt: false
    database_id: "b1229985-c3ad-4f03-9451-116fae1e3174"
    credentials_env: D1_API_TOKEN
    executor: actions
    schedule: "0 23 * * *"
    grace_minutes: 40
    keep: 3
    ignore_data:
      - sessions
      - charge_emails
      - charge_email_attempts
  louvorja:
    name: LouvorJA
    type: d1
    encrypt: false
    account_id: ebfd182d9bc3913163758a88118752f5
    database_id: "4705d209-b837-4cc3-b515-610470555605"
    credentials_env: DB_CREDENTIALS_LJA
    executor: actions
    schedule: "0 22 * * *"
    grace_minutes: 40
    keep: 5
