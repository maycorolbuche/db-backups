timezone: America/Sao_Paulo
databases:
  mx-sys-admin:
    name: MX Soft | Admin
    type: mysql
    executor: actions
    credentials_env: DB_CREDENTIALS_MX_SYS_ADMIN
    schedule: "*/10 * * * *"
    grace_minutes: 40
    keep: 3
    max_storage_mb: 500
    export_procedures: false
    export_functions: false
    export_views: false
    ignore_data:
      - ACESSOS
      - LOGS_PAGINA
